<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>TV Tracker — Developer Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" />
<link rel="stylesheet" href="/dashboard/styles.css" />
</head>
<body>

<div id="blob-bg" aria-hidden="true"></div>

<!-- LOGIN -->
<section id="login-screen" class="login-screen">
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark">✦</span>
      <span class="brand-name">TV Tracker</span>
    </div>
    <p class="login-sub">Developer Portal</p>
    <form id="login-form">
      <label for="password-input">Password</label>
      <input id="password-input" type="password" autocomplete="current-password" required />
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      <p id="login-error" class="error-text" hidden></p>
    </form>
  </div>
</section>

<!-- APP -->
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="sidebar-top">
      <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle sidebar" aria-expanded="true" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name">TV Tracker</span>
      </div>
    </div>
    <nav class="nav" aria-label="Primary">
      <button class="nav-item active" data-view="overview" aria-current="page">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span>
        <span class="nav-label">Overview</span>
      </button>
      <button class="nav-item" data-view="servers">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r="0.5" fill="currentColor"/><circle cx="7" cy="17" r="0.5" fill="currentColor"/></svg></span>
        <span class="nav-label">Servers</span>
      </button>
      <button class="nav-item" data-view="users">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
        <span class="nav-label">Tracked Users</span>
      </button>
      <button class="nav-item" data-view="activity">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
        <span class="nav-label">Recent Activity</span>
      </button>
      <button class="nav-item" data-view="leaderboards">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"/></svg></span>
        <span class="nav-label">Leaderboards</span>
      </button>
      <button class="nav-item" data-view="feedback">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
        <span class="nav-label">Feedback</span>
      </button>
      <button class="nav-item" data-view="send">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></span>
        <span class="nav-label">Send Message</span>
      </button>
      <button class="nav-item" data-view="controls">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span>
        <span class="nav-label">Bot Controls</span>
      </button>
    </nav>
    <button id="logout-btn" class="btn btn-ghost btn-block">
      <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
      <span class="nav-label">Log out</span>
    </button>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="view-title">Overview</h1>
      <div id="bot-status-pill" class="status-pill status-running" role="status" aria-live="polite">● Running</div>
    </header>

    <!-- OVERVIEW -->
    <section data-view-panel="overview" class="view-panel">
      <div class="stat-grid" id="overview-stats"></div>
      <div class="card" id="overview-bot-card"></div>
      <div class="overview-grid">
        <div class="card" id="overview-activity-card">
          <div class="card-header">
            <h2>Recent Activity</h2>
            <button class="btn btn-ghost btn-small" data-goto-view="activity">View all</button>
          </div>
          <div id="overview-activity-list" class="list"></div>
        </div>
        <div class="card card-narrow" id="overview-send-card">
          <h2>Quick Send</h2>
          <label for="overview-send-guild">Server</label>
          <select id="overview-send-guild"></select>
          <label for="overview-send-channel">Channel</label>
          <select id="overview-send-channel"></select>
          <label for="overview-send-message">Message</label>
          <textarea id="overview-send-message" rows="3" placeholder="Type what TV Tracker should post…"></textarea>
          <button id="overview-send-btn" class="btn btn-primary btn-block">Send as TV Tracker</button>
          <p id="overview-send-result" class="muted-note" role="status" aria-live="polite"></p>
        </div>
      </div>
    </section>

    <!-- SERVERS -->
    <section data-view-panel="servers" class="view-panel" hidden>
      <div class="card">
        <div class="card-header"><h2>Servers</h2><span id="servers-count" class="badge"></span></div>
        <div id="servers-list" class="list"></div>
      </div>
    </section>

    <!-- TRACKED USERS -->
    <section data-view-panel="users" class="view-panel" hidden>
      <div class="card">
        <div class="card-header"><h2>Tracked People</h2><span id="users-count" class="badge"></span></div>
        <div id="users-list" class="list"></div>
      </div>
    </section>

    <!-- ACTIVITY -->
    <section data-view-panel="activity" class="view-panel" hidden>
      <div class="card">
        <div class="card-header"><h2>Recent Activity</h2></div>
        <div id="activity-list" class="list"></div>
      </div>
    </section>

    <!-- LEADERBOARDS -->
    <section data-view-panel="leaderboards" class="view-panel" hidden>
      <div class="tabs">
        <button class="tab active" data-tab="recommended">Most Recommended</button>
        <button class="tab" data-tab="watched">Most Watched</button>
        <button class="tab" data-tab="watchlater">Watch Later</button>
        <button class="tab" data-tab="linked">Linked Simkl Accounts</button>
      </div>
      <div class="card">
        <p id="leaderboard-note" class="muted-note"></p>
        <div id="leaderboard-content" class="list"></div>
      </div>
    </section>

    <!-- FEEDBACK -->
    <section data-view-panel="feedback" class="view-panel" hidden>
      <div class="tabs">
        <button class="tab active" data-feedback-tab="all">All</button>
        <button class="tab" data-feedback-tab="new">New</button>
        <button class="tab" data-feedback-tab="resolved">Resolved</button>
        <button class="tab" data-feedback-tab="disputed">Disputed</button>
        <button class="tab" data-feedback-tab="later">Keep for Later</button>
      </div>
      <div id="feedback-list" class="list"></div>
    </section>

    <!-- SEND MESSAGE -->
    <section data-view-panel="send" class="view-panel" hidden>
      <div class="card card-narrow">
        <h2>Send a Message</h2>
        <label for="send-guild">Server</label>
        <select id="send-guild"></select>
        <label for="send-channel">Channel</label>
        <select id="send-channel"></select>
        <label for="send-message">Message</label>
        <textarea id="send-message" rows="5" placeholder="Type what TV Tracker should post…"></textarea>
        <button id="send-btn" class="btn btn-primary">Send as TV Tracker</button>
        <p id="send-result" class="muted-note" role="status" aria-live="polite"></p>
      </div>
    </section>

    <!-- CONTROLS -->
    <section data-view-panel="controls" class="view-panel" hidden>
      <div class="card card-narrow">
        <h2>Bot Controls</h2>
        <div class="control-row">
          <div>
            <p class="control-title">Polling</p>
            <p class="muted-note">Pausing stops Simkl polling &amp; new watch posts. Slash commands still work.</p>
          </div>
          <button id="pause-resume-btn" class="btn btn-primary">Pause</button>
        </div>
        <div class="control-row">
          <div>
            <p class="control-title">Redeploy</p>
            <p class="muted-note">Triggers your Render deploy hook.</p>
          </div>
          <button id="redeploy-btn" class="btn btn-danger">Redeploy</button>
        </div>
        <p id="controls-result" class="muted-note" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
</div>

<script src="/dashboard/app.js"></script>
</body>
</html>
